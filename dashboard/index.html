<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ShadowGraph Dashboard</title><style>body{font:16px system-ui;margin:2rem;max-width:1100px}button,input{font:inherit;padding:.5rem}section{margin:1rem 0;padding:1rem;border:1px solid #ddd;border-radius:8px}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem;max-height:500px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem}.card{padding:.75rem;background:#f5f5f5;border-radius:6px}</style></head><body><h1>ShadowGraph Dashboard</h1><p>Local read-only overview. Start the API with <code>npm start</code>.</p><section><label>API URL <input id="base" value="http://127.0.0.1:8787"></label> <button id="load">Load</button></section><section><div id="stats" class="grid"></div></section><section><h2>Review signals</h2><pre id="signals">Click Load</pre></section><section><h2>Graph records</h2><pre id="records">Click Load</pre></section><script>const $=id=>document.getElementById(id);async function load(){const base=$('base').value.replace(/\/$/,'');const [stats,signals,records]=await Promise.all([fetch(base+'/stats').then(r=>r.json()),fetch(base+'/review-signals').then(r=>r.json()),fetch(base+'/records').then(r=>r.json())]);$('stats').innerHTML=Object.entries(stats).map(([k,v])=>`<div class="card"><b>${k}</b><br>${v}</div>`).join('');$('signals').textContent=JSON.stringify(signals,null,2);$('records').textContent=JSON.stringify(records,null,2)}$('load').onclick=()=>load().catch(e=>alert(e.message));</script></body></html>
