<svg xmlns="http://www.w3.org/2000/svg" width="520" height="666" viewBox="0 0 520 666" role="img" aria-labelledby="title desc">
<title id="title">From ordinary work to useful experience</title>
<desc id="desc">Session A flows through capture and provider-assisted background extraction into local memory. Project-scoped delivery helps fresh Session B. Foreground work continues; cross-project reuse requires explicit sharing.</desc>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#182b3a}.title{font-size:17px;font-weight:700;letter-spacing:1px}.body{font-size:16px}.number{font-size:16px;font-weight:700;fill:#326979}.box{fill:#f3f7f8;stroke:#a8c4cb;stroke-width:1.5}.line{stroke:#326979;stroke-width:2;fill:none}</style>
<rect width="520" height="666" rx="16" fill="#ffffff"/>
<text x="260" y="30" text-anchor="middle" class="title">WORK CONTINUES. EXPERIENCE ACCUMULATES.</text>
<rect x="18" y="46" width="484" height="38" rx="8" fill="#e5f3ec"/>
<text x="260" y="71" text-anchor="middle" class="body">Foreground answers do not wait for extraction</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326979"/></marker></defs>
<rect class="box" x="18" y="104" width="484" height="68" rx="10"/>
<text class="number" x="34" y="131">01</text><text class="title" x="69" y="131">SESSION A</text>
<text class="body" x="34" y="155">Work, fail a check, repair, verify</text>
<path class="line" d="M260 172 v18" marker-end="url(#arrow)"/>
<rect class="box" x="18" y="194" width="484" height="68" rx="10"/>
<text class="number" x="34" y="221">02</text><text class="title" x="69" y="221">AUTOMATIC CAPTURE</text>
<text class="body" x="34" y="245">Prompts, answers and command results</text>
<path class="line" d="M260 262 v18" marker-end="url(#arrow)"/>
<rect class="box" x="18" y="284" width="484" height="68" rx="10"/>
<text class="number" x="34" y="311">03</text><text class="title" x="69" y="311">BACKGROUND EXTRACTION</text>
<text class="body" x="34" y="335">Selected model provider interprets evidence</text>
<path class="line" d="M260 352 v18" marker-end="url(#arrow)"/>
<rect class="box" x="18" y="374" width="484" height="68" rx="10"/>
<text class="number" x="34" y="401">04</text><text class="title" x="69" y="401">DURABLE LOCAL MEMORY</text>
<text class="body" x="34" y="425">Decisions, attempts, sources and uncertainty</text>
<path class="line" d="M260 442 v18" marker-end="url(#arrow)"/>
<rect class="box" x="18" y="464" width="484" height="68" rx="10"/>
<text class="number" x="34" y="491">05</text><text class="title" x="69" y="491">RELEVANT DELIVERY</text>
<text class="body" x="34" y="515">Project-only; wider reuse by explicit choice</text>
<path class="line" d="M260 532 v18" marker-end="url(#arrow)"/>
<rect class="box" x="18" y="554" width="484" height="68" rx="10"/>
<text class="number" x="34" y="581">06</text><text class="title" x="69" y="581">FRESH SESSION B</text>
<text class="body" x="34" y="605">Assess prior experience, then act</text>
<text x="260" y="649" text-anchor="middle" class="body">Local-first storage · Provider-assisted processing</text>
</svg>
