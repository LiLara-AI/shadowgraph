name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate JSON integration templates
        run: node --input-type=module -e "import fs from 'node:fs'; for (const f of fs.readdirSync('integrations').filter(x => x.endsWith('.json'))) JSON.parse(fs.readFileSync('integrations/' + f, 'utf8'));"
