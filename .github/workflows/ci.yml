name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository. No job needs write access to
# contents, packages, issues, or id-token, so nothing is granted.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    # The full suite runs about 17 minutes locally, the T-10 file alone about
    # 6 (PR-37c review finding 14): 45 leaves margin for the Ubuntu legs. On
    # GitHub's Windows runners SQLite file I/O is several times slower: the
    # T-10 SQLite restore matrix (test/restore-wrapper-r16.test.js) took 40-85 s
    # a case against about 5 s on Ubuntu, `npm test` took 37 minutes on Node 24
    # and was cut off at 45 with about nine tenths done on Node 22 (runs
    # 37407942637 and 37407954378). Windows Node 20 skips SQLite and takes about
    # 18. Windows legs get 75; a hang still stops at that bound.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the rollback-floor tests load 210f009 from it,
          # and skip when it is missing (PR-37c review finding 12).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      # The delivery-budget performance cases (250 ms elapsed added latency per
      # grant delivery, all of its I/O included, a cold store, every sample) run
      # once per job in their own mandatory step, before the suite: some suite
      # tests start detached processes, and none may compete with this
      # measurement. The step fails unless every performance case ran and
      # passed (PR #12).
      - name: Delivery-budget performance (dedicated, before the suite)
        id: performance
        run: npm run test:performance
      # The suite still runs when only the performance step failed, so its own
      # results are kept; the job stays failed.
      - name: Test suite
        if: ${{ success() || (failure() && steps.performance.outcome == 'failure') }}
        run: npm test
      - run: npm audit --omit=dev
      - run: npm run check:integrations
      - name: Install pinned MCP gate clients
        if: matrix.node-version == 24
        run: npm ci --prefix tooling/mcp-gates --ignore-scripts
      - name: Strict MCP Inspector (35 full / 16 compact) and pinned Glama mcp-proxy gate
        if: matrix.node-version == 24
        run: npm run check:mcp
      - name: Assert SQLite coverage (zero skips, todos, or failures)
        if: matrix.node-version != 20
        run: node scripts/assert-sqlite-coverage.mjs
      - run: python -m py_compile integrations/hermes-agent.py
      - run: npm run check:package
      - name: Real tarball clean-install smoke (path contains spaces)
        run: npm run smoke:package
