name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository. No job needs write access to
# contents, packages, issues, or id-token, so nothing is granted.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run check:integrations
      - name: Strict MCP Inspector (27 full / 12 compact) and pinned Glama mcp-proxy gate
        if: matrix.node-version == 24
        run: npm run check:mcp
      - name: Assert SQLite coverage (zero skips, todos, or failures)
        if: matrix.node-version != 20
        run: node scripts/assert-sqlite-coverage.mjs
      - run: python -m py_compile integrations/hermes-agent.py
      - run: npm run check:package
      - name: Real tarball clean-install smoke (path contains spaces)
        run: npm run smoke:package
