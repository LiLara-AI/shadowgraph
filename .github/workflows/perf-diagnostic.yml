# Diagnostic only, on a throwaway branch that is never merged.
# A/B on the CI runner: the unmodified performance step (218c3c9) against the
# fix branch's step (which writes out pending writes first). Before each run a
# copy of node_modules leaves a backlog like npm ci's, and the run starts 28 s
# later, so the kernel's 30 s expiry writes that backlog out during the run.
# Every rename the step makes is traced.
name: perf-diagnostic

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  ab:
    name: A/B / Node ${{ matrix.node-version }} / ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          path: diag
      - uses: actions/checkout@v4
        with:
          ref: 218c3c957728e5319264838195b0326323d1f600
          path: base
      - uses: actions/checkout@v4
        with:
          ref: fix/delivery-budget-benchmark
          path: fix
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install bpftrace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bpftrace >/dev/null && bpftrace --version
      - name: npm ci
        run: (cd base && npm ci) && (cd fix && npm ci) && git -C base log --oneline -1 && git -C fix log --oneline -1 && du -sh base/node_modules
      - name: Environment
        run: |
          findmnt -T "$RUNNER_TEMP"
          for d in /sys/block/sd* /sys/block/nvme*; do [ -e "$d" ] && echo "$d $(cat $d/queue/scheduler) wbt=$(cat $d/queue/wbt_lat_usec 2>/dev/null)"; done
          sync
      - name: A/B runs, traced
        run: |
          sudo bpftrace "$GITHUB_WORKSPACE/diag/diag/rename.bt" > "$RUNNER_TEMP/bt.txt" 2>&1 &
          BT=$!
          sleep 8
          for i in 1 2 3 4; do
            if [ $((i % 2)) -eq 1 ]; then order="base fix"; else order="fix base"; fi
            for v in $order; do
              cp -a base/node_modules "$RUNNER_TEMP/backlog"
              sleep 28
              start=$(awk '{printf "%d", $1*1000}' /proc/uptime)
              dirty=$(awk '/^Dirty:/{print $2}' /proc/meminfo)
              (cd $v && npm run --silent test:performance > "$RUNNER_TEMP/$v-$i.log" 2>&1); status=$?
              end=$(awk '{printf "%d", $1*1000}' /proc/uptime)
              worst=$(grep -o '"grantAdded":[0-9.]*,"nullReferenceAdded":[0-9.]*' "$RUNNER_TEMP/$v-$i.log" | tr ',' '\n' | cut -d: -f2 | sort -n | tail -1)
              echo "AB variant=$v i=$i exit=$status worst=$worst start=$start end=$end dirty_kb_at_start=$dirty $(grep -o '"pendingWrites":{[^}]*}' "$RUNNER_TEMP/$v-$i.log")"
              rm -rf "$RUNNER_TEMP/backlog"; sync
            done
          done
          sleep 2
          sudo kill -INT $BT; wait $BT || true
      - name: Trace output
        if: always()
        run: grep -E -A18 'SLOW_RENAME' "$RUNNER_TEMP/bt.txt" | head -400; grep -c SLOW_RQ "$RUNNER_TEMP/bt.txt" || true; sed -n '/@rename_us/,/^$/p' "$RUNNER_TEMP/bt.txt"
      - name: Diagnostic lines
        if: always()
        run: for f in "$RUNNER_TEMP"/base-*.log "$RUNNER_TEMP"/fix-*.log; do echo "### $f"; grep -E 'performance step conditions|grantAdded|^not ok|performance step failed' "$f"; done
