# Diagnostic only, on a throwaway branch that is never merged: how long the
# ext4lazyinit kernel thread keeps initialising a fresh runner's disk, and how
# much it writes.
name: perf-diagnostic

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  lazyinit:
    name: lazyinit probe ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Poll ext4lazyinit
        run: |
          findmnt -n -o SOURCE,SIZE,OPTIONS /; df -h / | tail -1
          sudo dumpe2fs -h "$(findmnt -n -o SOURCE /)" 2>/dev/null | grep -E 'Inode count|Inode size|Block count|Flex block group size|Filesystem features' || true
          dev=$(basename "$(findmnt -n -o SOURCE /)" | sed 's/p\?[0-9]*$//')
          w0=$(awk -v d="$dev" '$3==d{print $10}' /proc/diskstats)
          start=$(cut -d' ' -f1 /proc/uptime)
          echo "probe start uptime=$start"
          for i in $(seq 1 240); do
            if ! pgrep -x ext4lazyinit >/dev/null; then echo "ext4lazyinit absent at uptime=$(cut -d' ' -f1 /proc/uptime)"; break; fi
            [ $((i % 6)) -eq 0 ] && echo "still running uptime=$(cut -d' ' -f1 /proc/uptime) written_MB=$(( ($(awk -v d="$dev" '$3==d{print $10}' /proc/diskstats) - w0) / 2048 ))"
            sleep 5
          done
          echo "end uptime=$(cut -d' ' -f1 /proc/uptime) written_MB=$(( ($(awk -v d="$dev" '$3==d{print $10}' /proc/diskstats) - w0) / 2048 ))"
