# Diagnostic only, on a throwaway branch that is never merged: CI's own steps
# and the fix branch's performance step on 12 fresh runners, recording the
# ext4lazyinit wait, the flush and every save's rename time.
name: perf-diagnostic

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  fix:
    name: fix a4783e9 / Node ${{ matrix.node-version }} / ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        replica: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4783e9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - name: Delivery-budget performance (as CI)
        run: |
          echo "uptime at step start $(cut -d' ' -f1 /proc/uptime)"
          npm run test:performance > "$RUNNER_TEMP/perf.log" 2>&1 && r=0 || r=$?
          grep -o 'performance step conditions.*' "$RUNNER_TEMP/perf.log"
          echo "exit=$r worst=$(grep -o '"grantAdded":[0-9.]*,"nullReferenceAdded":[0-9.]*' "$RUNNER_TEMP/perf.log" | tr ',' '\n' | cut -d: -f2 | sort -n | tail -1) max_rename_ms=$(grep -o '"callMs":[0-9.]*' "$RUNNER_TEMP/perf.log" | cut -d: -f2 | sort -n | tail -1) renames_over_20ms=$(grep -o '"callMs":[0-9.]*' "$RUNNER_TEMP/perf.log" | cut -d: -f2 | awk '$1>20' | wc -l)"
          exit $r
